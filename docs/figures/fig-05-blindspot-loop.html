<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知识库盲区自动闭环</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #faf6ee;
      --color-paper-2: #f1ebdd;
      --color-ink:     #2b2a24;
      --color-muted:   #5c5748;
      --color-soft:    #8a8371;
      --color-accent:  #d98e00;
      --font-sans:     'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Loop · 技术方案书 2.3 创新点 5</p>
    <h1>回答类型判定驱动的盲区自动闭环：知识库随运营生长</h1>

    <svg viewBox="0 0 1040 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig05-loop-title fig05-loop-desc">
      <title id="fig05-loop-title">知识库盲区自动闭环飞轮</title>
      <desc id="fig05-loop-desc">五个站点的运营飞轮：统计盲区、生成标准答案、回传入库、检索服务、日志沉淀，每一圈都把标准答案写回中心的用户知识库，使其持续生长。</desc>

      <rect width="100%" height="100%" fill="#faf6ee"/>

      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5c5748"/></marker>
        <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8a8371"/></marker>
      </defs>

      <!-- ===== 环形流（顺时针弧） R=240 C=(520,340) ===== -->
      <!-- s0(top)→s1 -->
      <path d="M 600 113.7 A 240 240 0 0 1 734.7 232.6" fill="none" stroke="#5c5748" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- s1→s2 -->
      <path d="M 756.3 297.8 A 240 240 0 0 1 697.7 501.3" fill="none" stroke="#5c5748" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- s2→s3 -->
      <path d="M 600.2 566.2 A 240 240 0 0 1 440.9 566.6" fill="none" stroke="#5c5748" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- s3→s4 -->
      <path d="M 343.1 502.2 A 240 240 0 0 1 283.7 297.8" fill="none" stroke="#5c5748" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- s4→s0 -->
      <path d="M 304.8 233.8 A 240 240 0 0 1 439.0 114.1" fill="none" stroke="#5c5748" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ===== 回写辐条（虚线，指向中心） ===== -->
      <line x1="520"   y1="132"   x2="520"   y2="282"   stroke="#8a8371" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
      <line x1="668.2" y1="291.8" x2="625.7" y2="305.7" stroke="#8a8371" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
      <line x1="637.8" y1="502.2" x2="561.3" y2="396.9" stroke="#8a8371" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
      <line x1="402.2" y1="502.2" x2="478.7" y2="396.9" stroke="#8a8371" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
      <line x1="371.8" y1="291.8" x2="414.3" y2="305.7" stroke="#8a8371" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>

      <!-- 辐条标签（2 个，带遮罩） -->
      <rect x="530" y="196" width="104" height="16" rx="2" fill="#faf6ee"/>
      <text x="582" y="208" fill="#8a8371" font-size="12" font-weight="500" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">盲区清单</text>
      <rect x="618" y="440" width="104" height="16" rx="2" fill="#faf6ee"/>
      <text x="670" y="452" fill="#8a8371" font-size="12" font-weight="500" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">标准答案入库</text>

      <!-- ===== 站点 ===== -->
      <!-- s0 顶部：盲区统计 -->
      <rect x="440" y="68" width="160" height="64" rx="6" fill="#faf6ee" stroke="#2b2a24" stroke-width="1"/>
      <text x="520" y="95" fill="#2b2a24" font-size="12" font-weight="600" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">① 盲区统计</text>
      <text x="520" y="113" fill="#8a8371" font-size="9" text-anchor="middle" font-family="'Geist Mono',monospace">classify_answer</text>

      <!-- s1 右上：生成标准答案 -->
      <rect x="668.2" y="233.8" width="160" height="64" rx="6" fill="#faf6ee" stroke="#2b2a24" stroke-width="1"/>
      <text x="748.2" y="260.8" fill="#2b2a24" font-size="12" font-weight="600" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">② 生成标准答案</text>
      <text x="748.2" y="278.8" fill="#8a8371" font-size="9" text-anchor="middle" font-family="'Geist Mono',monospace">kb_agent LLM</text>

      <!-- s2 右下：回传入库（焦点） -->
      <rect x="581.1" y="502.2" width="160" height="64" rx="6" fill="rgba(217,142,0,0.10)" stroke="#d98e00" stroke-width="1.2"/>
      <text x="661.1" y="529.2" fill="#2b2a24" font-size="12" font-weight="600" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">③ 回传入库</text>
      <text x="661.1" y="547.2" fill="#8a8371" font-size="9" text-anchor="middle" font-family="'Geist Mono',monospace">dedup x3 gates</text>

      <!-- s3 左下：检索服务 -->
      <rect x="298.9" y="502.2" width="160" height="64" rx="6" fill="#faf6ee" stroke="#2b2a24" stroke-width="1"/>
      <text x="378.9" y="529.2" fill="#2b2a24" font-size="12" font-weight="600" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">④ 检索服务</text>
      <text x="378.9" y="547.2" fill="#8a8371" font-size="9" text-anchor="middle" font-family="'Geist Mono',monospace">hybrid retrieval</text>

      <!-- s4 左上：日志沉淀 -->
      <rect x="211.8" y="233.8" width="160" height="64" rx="6" fill="#faf6ee" stroke="#2b2a24" stroke-width="1"/>
      <text x="291.8" y="260.8" fill="#2b2a24" font-size="12" font-weight="600" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">⑤ 日志沉淀</text>
      <text x="291.8" y="278.8" fill="#8a8371" font-size="9" text-anchor="middle" font-family="'Geist Mono',monospace">question_logs</text>

      <!-- ===== 中心枢纽 ===== -->
      <rect x="420" y="288" width="200" height="104" rx="6" fill="#2b2a24"/>
      <text x="520" y="332" fill="#faf6ee" font-size="14" font-weight="600" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">用户知识库</text>
      <text x="520" y="356" fill="rgba(250,246,238,0.72)" font-size="12" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">每圈沉淀一条标准答案</text>
      <text x="520" y="374" fill="rgba(250,246,238,0.72)" font-size="9" text-anchor="middle" font-family="'Geist Mono',monospace">grow with operations</text>

      <!-- Legend -->
      <line x1="64" y1="620" x2="976" y2="620" stroke="rgba(43,42,36,0.10)" stroke-width="0.8"/>
      <text x="64" y="640" fill="#5c5748" font-size="9" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
      <line x1="148" y1="636" x2="172" y2="636" stroke="#5c5748" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="180" y="640" fill="#5c5748" font-size="12" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">运营流程（顺时针）</text>
      <line x1="340" y1="636" x2="364" y2="636" stroke="#8a8371" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
      <text x="372" y="640" fill="#5c5748" font-size="12" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">写回知识库</text>
      <rect x="494" y="628" width="14" height="12" rx="2" fill="rgba(217,142,0,0.10)" stroke="#d98e00" stroke-width="1"/>
      <text x="516" y="640" fill="#5c5748" font-size="12" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">去重三道闸门把关</text>
      <text x="976" y="664" fill="#8a8371" font-size="9" text-anchor="end" font-family="'Geist Mono',monospace">blind-spot criterion = answer type, not empty references</text>
    </svg>
  </div>
</body>
</html>
